# =============================================================================
# VisionForensics AI — Controlled Pilot Deployment Orchestration
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: visionforensics-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionforensics}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_master_pass_2026}
    volumes:
      - pilot_pg_data:/var/lib/postgresql/data
      - ./backend/scratch_setup_roles.sql:/docker-entrypoint-initdb.d/01_setup_roles.sql:ro
    networks:
      pilot_net:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-visionforensics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL is NOT exposed to external host interfaces in pilot mode

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend Service (ASGI Workers)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionforensics-pilot-backend
    restart: unless-stopped
    env_file:
      - .env.pilot
    environment:
      DATABASE_URL: postgresql://visionforensics_app:${APP_DB_PASSWORD:-app_secure_pass_2026}@postgres:5432/visionforensics
      MIGRATION_DATABASE_URL: postgresql://visionforensics_migrator:${MIGRATOR_DB_PASSWORD:-migrator_secure_pass_2026}@postgres:5432/visionforensics
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pilot_uploads:/app/uploads
      - pilot_processed:/app/processed
      - pilot_reports:/app/reports
      - pilot_heatmaps:/app/heatmaps
    networks:
      pilot_net:
        ipv4_address: 172.28.0.20
    # Port 8000 is internal only; reverse proxy routes traffic

  # ---------------------------------------------------------------------------
  # 3. Nginx Reverse Proxy & Frontend Static Hosting
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionforensics-pilot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PILOT_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${PILOT_HTTPS_PORT:-8443}:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    networks:
      pilot_net:
        ipv4_address: 172.28.0.10

# =============================================================================
# Persistent Storage Volumes
# =============================================================================
volumes:
  pilot_pg_data:
    name: visionforensics_pilot_pg_data
  pilot_uploads:
    name: visionforensics_pilot_uploads
  pilot_processed:
    name: visionforensics_pilot_processed
  pilot_reports:
    name: visionforensics_pilot_reports
  pilot_heatmaps:
    name: visionforensics_pilot_heatmaps

# =============================================================================
# Isolated Container Network (Narrowly Scoped Subnet)
# =============================================================================
networks:
  pilot_net:
    name: visionforensics_pilot_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
