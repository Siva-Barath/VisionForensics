# =============================================================================
# VisionForensics AI — Pilot Nginx Reverse Proxy Configuration (HTTPS Enforced)
# =============================================================================

# 1. Plain HTTP Server — Redirect all analyst access to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Analysts must access the system via encrypted HTTPS only
    return 301 https://$host:8443$request_uri;
}

# 2. Hardened HTTPS Server (Pilot TLS Termination)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Certificates
    ssl_certificate /etc/nginx/certs/pilot.crt;
    ssl_certificate_key /etc/nginx/certs/pilot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Static SPA root
    root /usr/share/nginx/html;
    index index.html;

    # Maximum file upload size (matching backend max_file_size_mb + multipart overhead)
    client_max_body_size 25M;

    # Hardened Security Response Headers
    include /etc/nginx/security-headers.conf;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Assets with Immutable Cache Control
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Proxy Routing to FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # Forward Client Identification Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for streaming responses (PDF report downloads)
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Single Page Application (SPA) Fallback
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
